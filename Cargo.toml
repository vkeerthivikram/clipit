[package]
name = "clipit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Clipboard history applet for the COSMIC desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
wl-clipboard-rs = "0.9.3"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
# Codes the iced image widget can decode; libcosmic enables png+jpeg,
# these add webp+bmp through Cargo feature unification.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

[dev-dependencies]
unic-langid = "0.9"

[dependencies.cosmic-settings-config]
git = "https://github.com/pop-os/cosmic-settings-daemon"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]
